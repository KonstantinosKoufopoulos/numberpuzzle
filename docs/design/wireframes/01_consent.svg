<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800"><rect width="360" height="800" fill="#f6f6f6"/><text x="76.6" y="180" font-family="Manrope" font-size="28" font-weight="800" fill="#222" xml:space="preserve">Number Puzzle</text><text x="46.3" y="210" font-family="Manrope" font-size="13" font-weight="500" fill="#666" xml:space="preserve">Το number match που σέβεται τη σκέψη σου</text><rect width="360" height="800" fill="#000" opacity="0.45"/><rect x="0" y="420" width="360" height="400" rx="20" fill="#fff" stroke="#888" stroke-width="1.5" /><rect x="160" y="430" width="40" height="4" rx="2" fill="#bbb" stroke="none" stroke-width="1.5" /><text x="24.0" y="470" font-family="Manrope" font-size="19" font-weight="800" fill="#222" xml:space="preserve">Η ιδιωτικότητά σου</text><text x="24.0" y="502" font-family="Manrope" font-size="14" font-weight="500" fill="#555" xml:space="preserve">Χρησιμοποιούμε διαφημίσεις μόνο όταν το</text><text x="24.0" y="524" font-family="Manrope" font-size="14" font-weight="500" fill="#555" xml:space="preserve">ζητάς (βίντεο για βοήθεια) και μετά τη νίκη.</text><text x="24.0" y="546" font-family="Manrope" font-size="14" font-weight="500" fill="#555" xml:space="preserve">Ποτέ μέσα στο επίπεδο. Επίλεξε πώς</text><text x="24.0" y="568" font-family="Manrope" font-size="14" font-weight="500" fill="#555" xml:space="preserve">θα χρησιμοποιούνται τα δεδομένα σου.</text><text x="24.0" y="590" font-family="Manrope" font-size="14" font-weight="500" fill="#555" xml:space="preserve">(Φόρμα Google UMP)</text><rect x="24" y="650" width="312" height="48" rx="12" fill="#333" stroke="#333" stroke-width="1.5" /><text x="141.8" y="679.0" font-family="Manrope" font-size="15" font-weight="700" fill="#fff" xml:space="preserve">Συναίνεση</text><rect x="24" y="708" width="312" height="48" rx="12" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="103.2" y="737.0" font-family="Manrope" font-size="15" font-weight="700" fill="#333" 